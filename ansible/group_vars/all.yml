---
# Docker Hub images (build & push from each service repo first)
docker_registry: soufian1
image_tag: latest

gateway_image: "{{ docker_registry }}/chat-app-gateway:{{ image_tag }}"
worker_image: "{{ docker_registry }}/chat-app-worker:{{ image_tag }}"
frontend_image: "{{ docker_registry }}/chat-app-frontend:{{ image_tag }}"

# Path to kubeconfig generated by Terraform (on the Grid'5000 frontend)
kubeconfig_path: "{{ playbook_dir }}/../../terraform/kube_config_cluster.yml"

# Kubernetes overlay to apply
k8s_overlay: grid5000

# NVIDIA
install_nvidia_toolkit: true
install_nvidia_device_plugin: true
nvidia_device_plugin_version: "v0.14.5"

# Ollama model pulled after deploy (optional)
ollama_model: "llama3.2:3b"

# App secrets (override in vault or env for production)
gateway_secret_key: "change-me-on-grid5000"
