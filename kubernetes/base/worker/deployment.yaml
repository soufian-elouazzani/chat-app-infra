apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: chat-app
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: soufian1/chat-app-worker:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: RABBITMQ_URL
            - name: OLLAMA_URL
              valueFrom:
                secretKeyRef:
                  name: chat-app-secrets
                  key: OLLAMA_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: chat-app-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
