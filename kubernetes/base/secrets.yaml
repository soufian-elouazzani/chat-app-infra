apiVersion: v1
kind: Secret
metadata:
  name: chat-app-secrets
  namespace: chat-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: chat
  SECRET_KEY: change-me-on-grid5000
  DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/chat_app
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  OLLAMA_URL: http://ollama:11434
